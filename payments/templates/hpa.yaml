{{- include "payments.set.env.variables" . }}
{{- if .Values.config.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Values.microServiceName }}
  labels:
    app: {{ .Values.appName }}
    env: {{ .Values.env }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.microServiceName }}
  minReplicas: {{ .Values.config.autoscaling.minReplicas | default 1 }}
  maxReplicas: {{ .Values.config.autoscaling.maxReplicas | default 3 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.config.autoscaling.targetCPUUtilizationPercentage | default 80 }}
{{- end }}
